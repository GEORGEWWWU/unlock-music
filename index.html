  <style>
    /* 首屏：只负责别白屏 */
    :root {
      color-scheme: light dark;
      --l-bg: #fafafa;
      --l-text: #1c1c1e;
      --l-text-2: #6b6b70;
      --l-text-3: #9a9aa0;
      --l-line: rgba(60, 60, 67, .14);
      --l-accent: #0071e3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --l-bg: #000;
        --l-text: #f2f2f7;
        --l-text-2: #a1a1a8;
        --l-text-3: #8e8e93;
        --l-line: rgba(84, 84, 88, .62);
        --l-accent: #0a84ff;
      }
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--l-bg);
      color: var(--l-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    #loader-mask {
      position: fixed;
      inset: 0;
      z-index: 1009;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
      background: var(--l-bg);
      text-align: center;
    }

    #loader {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--l-line);
      border-top-color: var(--l-accent);
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loader-source {
      margin: 0;
      font-size: 12.5px;
      color: var(--l-text-3);
    }

    #loader-mask h2 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
    }

    #loader-mask h3 {
      margin: 0;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--l-text-2);
      line-height: 1.8;
    }

    #loader-mask a {
      color: var(--l-accent);
      text-decoration: none;
      margin: 0 3px;
    }

    #loader-tips-timeout {
      max-width: 600px;
    }

    #loader-tips-outdated span {
      color: #d70015;
    }

    #loader-js {
      font-size: 14px;
      color: var(--l-text);
    }
  </style>

<body>
  <div id="loader-mask">
    <div id="loader"></div>
    <noscript>
      <h3 id="loader-js">请启用 JavaScript</h3>
    </noscript>
    <h3 id="loader-source">请勿直接运行源代码！</h3>
    <div id="loader-tips-outdated" hidden>
      <h2>可能正在使用不受支持的浏览器</h2>
      <h3>请使用较新版本的 <span>Edge / Chrome / Firefox</span>，或把双核浏览器切到「极速模式」。</h3>
    </div>
    <h3 id="loader-tips-timeout" hidden>
      建议使用 <a href="https://www.microsoft.com/zh-cn/edge" target="_blank" rel="noopener">Edge</a>
      <a href="https://www.google.cn/chrome/" target="_blank" rel="noopener">Chrome</a>

    </h3>

  <header class="app-header">
    <img class="app-header__logo" src="./img/icons/logo.png" alt="音乐解锁" width="24" height="24">
    <h1 class="app-header__title">音乐解锁</h1>
    <span class="app-header__sub">Unlock Music</span>
    <span class="app-header__spacer"></span>
    <button class="settings-btn" type="button" aria-expanded="false" aria-controls="app-control">设置</button>
  </header>

  <div id="app"></div>

  <script>
    /* 设置面板开关：默认收起，点空白处 / Esc 关闭 */
    (function () {
      var root = document.documentElement;
      var btn = document.querySelector('.settings-btn');
      var panel = null;

      function setOpen(open) {
        root.classList.toggle('settings-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        setOpen(!root.classList.contains('settings-open'));
      });

      document.addEventListener('click', function (e) {
        if (!root.classList.contains('settings-open')) return;
        panel = panel || document.getElementById('app-control');
        if (panel && panel.contains(e.target)) return;
        if (btn.contains(e.target)) return;
        setOpen(false);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
    })();
  </script>

  <!-- 自绘底部播放器（脚本初始化） -->
  <div class="um-player" id="um-player" hidden></div>

  <script>
    /* ============ 设置本地记忆（localStorage） ============ */
    (function () {
      var KEY = 'um.conf.home';

      function findHome(vm, depth) {
        if (!vm || depth > 8) return null;
        if (vm.$options && vm.$options.name === 'Home') return vm;
        var cs = vm.$children || [];
        for (var i = 0; i < cs.length; i++) {
          var r = findHome(cs[i], depth + 1);
          if (r) return r;
        }
        return null;
      }

      function getHome() {
        var root = document.getElementById('app');
        var vm = root && root.__vue__;
        return vm ? findHome(vm, 0) : null;
      }

      function read() {
        try {
          return JSON.parse(localStorage.getItem(KEY)) || {};
        } catch (e) {
          return {};
        }
      }

      function write(patch) {
        var s = read();
        for (var k in patch) s[k] = patch[k];
        try {
          localStorage.setItem(KEY, JSON.stringify(s));
        } catch (e) {}
      }

      function init() {
        var home = getHome();
        if (!home) return setTimeout(init, 120);
        var s = read();
        if (typeof s.policy === 'number') {
          // 恢复「立即保存」时临时屏蔽目录选择弹窗
          var orig = home.showDirectlySave;
          home.showDirectlySave = function () {};
          home.filename_policy = s.policy;
          if (typeof s.instant_save === 'boolean') home.instant_save = s.instant_save;
          home.showDirectlySave = orig;
        }
        home.$watch('filename_policy', function (v) {
          write({ policy: v });
        });
        home.$watch('instant_save', function (v) {
          write({ instant_save: v });
        });
      }

      init();
    })();

    /* ============ 自绘底部播放器 ============ */
    (function () {
      var SVG_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z"/></svg>';
      var SVG_PAUSE = '<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>';
      var SVG_CLOSE = '<svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';

      function fmt(t) {
        if (!isFinite(t) || t < 0) t = 0;
        var m = Math.floor(t / 60),
          s = Math.floor(t % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function init() {
        var audio = document.querySelector('.el-main audio');
        if (!audio) return setTimeout(init, 150);
        audio.removeAttribute('controls');
        try {
          audio.controls = false;
        } catch (e) {}

        var bar = document.getElementById('um-player');
        bar.innerHTML =
          '<div class="um-player__row">' +
          '<div class="um-player__cover"></div>' +
          '<div class="um-player__meta">' +
          '<div class="um-player__title"></div>' +
          '<div class="um-player__artist"></div>' +
          '</div>' +
          '<div class="um-player__center">' +
          '<button type="button" class="um-player__btn um-player__btn--play" data-tip="播放 / 暂停">' +
          SVG_PAUSE +
          '</button>' +
          '<span class="um-player__time um-player__cur">0:00</span>' +
          '<div class="um-player__bar"><div class="um-player__fill"></div></div>' +
          '<span class="um-player__time um-player__dur">0:00</span>' +
          '</div>' +
          '<button type="button" class="um-player__close" data-tip="关闭播放器">' +
          SVG_CLOSE +
          '</button>' +
          '</div>';

        var cover = bar.querySelector('.um-player__cover');
        var title = bar.querySelector('.um-player__title');
        var artist = bar.querySelector('.um-player__artist');
        var cur = bar.querySelector('.um-player__cur');
        var dur = bar.querySelector('.um-player__dur');
        var fill = bar.querySelector('.um-player__fill');
        var track = bar.querySelector('.um-player__bar');
        var playBtn = bar.querySelector('.um-player__btn--play');
        var closeBtn = bar.querySelector('.um-player__close');

        function findHome(vm, depth) {
          if (!vm || depth > 8) return null;
          if (vm.$options && vm.$options.name === 'Home') return vm;
          var cs = vm.$children || [];
          for (var i = 0; i < cs.length; i++) {
            var r = findHome(cs[i], depth + 1);
            if (r) return r;
          }
          return null;
        }

        function rowOf(src) {
          var root = document.getElementById('app');
          var vm = root && root.__vue__;
          var home = vm ? findHome(vm, 0) : null;
          if (!home || !home.tableData) return null;
          for (var i = 0; i < home.tableData.length; i++) {
            if (home.tableData[i].file === src) return home.tableData[i];
          }
          return null;
        }

        function show() {
          var src = audio.getAttribute('src');
          if (!src) return;
          var row = rowOf(src);
          if (row) {
            title.textContent = row.title || '未知曲目';
            artist.textContent = row.artist || '';
            cover.style.backgroundImage = row.picture ? 'url(' + row.picture + ')' : 'none';
          }
          bar.hidden = false;
          document.documentElement.classList.add('um-playing');
          var p = audio.play();
          if (p && p.catch) p.catch(function () {});
        }

        new MutationObserver(show).observe(audio, { attributes: true, attributeFilter: ['src'] });

        playBtn.addEventListener('click', function () {
          if (audio.paused) {
            var p = audio.play();
            if (p && p.catch) p.catch(function () {});
          } else {
            audio.pause();
          }
        });

        track.addEventListener('click', function (e) {
          var r = track.getBoundingClientRect();
          var ratio = (e.clientX - r.left) / r.width;
          if (isFinite(audio.duration)) audio.currentTime = ratio * audio.duration;
        });

        closeBtn.addEventListener('click', function () {
          audio.pause();
          audio.removeAttribute('src');
          try {
            audio.load();
          } catch (e) {}
          bar.hidden = true;
          document.documentElement.classList.remove('um-playing');
        });

        audio.addEventListener('play', function () {
          playBtn.innerHTML = SVG_PAUSE;
        });
        audio.addEventListener('pause', function () {
          playBtn.innerHTML = SVG_PLAY;
        });
        audio.addEventListener('ended', function () {
          playBtn.innerHTML = SVG_PLAY;
        });
        audio.addEventListener('loadedmetadata', function () {
          dur.textContent = fmt(audio.duration);
        });
        audio.addEventListener('timeupdate', function () {
          cur.textContent = fmt(audio.currentTime);
          if (isFinite(audio.duration) && audio.duration > 0) {
            fill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
          }
        });
      }

      init();
    })();
  </script>

  <script src="./loader.js"></script>
  <script src="js/chunk-vendors.0619865c.js"></script>
  <script src="js/app.bde85ddf.js"></script>
